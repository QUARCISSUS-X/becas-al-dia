name: Publicar extensión

# Crea un release con la extensión para Chrome/Edge (.zip) y Firefox (.xpi).
# Se activa al subir una etiqueta vX.Y.Z (debe coincidir con la versión del manifest) o a mano.
# Si existen los secretos AMO_JWT_ISSUER y AMO_JWT_SECRET (claves de addons.mozilla.org),
# el .xpi se firma con Mozilla y se instala de forma permanente en Firefox normal.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Versión
        id: v
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión del manifest ($V)"; exit 1
          fi

      - name: Pruebas
        working-directory: collector
        run: npm ci && npm test

      - name: Empaquetar
        run: node scripts/empaquetar.mjs

      - name: Validar para Firefox
        run: npx --yes web-ext@8 lint -s dist/firefox --self-hosted --warnings-as-errors=false

      - name: Firmar para Firefox (si hay claves de Mozilla)
        id: firma
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "Sin claves de Mozilla: el .xpi queda sin firmar."; echo "firmado=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npx --yes web-ext@8 sign -s dist/firefox --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir dist/firmado --approval-timeout 900000
          mv dist/firmado/*.xpi "dist/becas-al-dia-firefox-${{ steps.v.outputs.version }}.xpi"
          echo "firmado=si" >> "$GITHUB_OUTPUT"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          FIRMADO: ${{ steps.firma.outputs.firmado }}
        run: |
          if [ "$FIRMADO" = "si" ]; then
            FF="**Firefox** (128 o posterior, firmado por Mozilla): descarga \`becas-al-dia-firefox-$V.xpi\` y ábrelo con Firefox (o arrástralo a una ventana de Firefox) → **Añadir**."
          else
            FF="**Firefox** (128 o posterior). Este .xpi **no está firmado** por Mozilla, así que Firefox normal no lo instala de forma permanente:
          - *Prueba rápida*: \`about:debugging#/runtime/this-firefox\` → **Cargar complemento temporal…** → elige el .xpi. Se quita al cerrar Firefox.
          - *Permanente*: Firefox Developer Edition o Nightly → \`about:config\` → \`xpinstall.signatures.required\` = \`false\` → arrastra el .xpi a la ventana."
          fi
          cat > notas.md <<NOTAS
          ## Instalación

          **Chrome / Edge**: descarga \`becas-al-dia-chrome-$V.zip\`, descomprímelo, abre \`chrome://extensions\` (o \`edge://extensions\`), activa **Modo de desarrollador** → **Cargar descomprimida** → elige la carpeta.

          $FF

          En Firefox la extensión se abre en la **barra lateral**: clic en el ícono de la barra de herramientas o \`Ctrl+B\` → Becas al Día.
          NOTAS
          sed -i 's/^          //' notas.md
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.xpi --clobber
            gh release edit "$TAG" --notes-file notas.md
          else
            gh release create "$TAG" dist/*.zip dist/*.xpi --title "Becas al Día $V" --notes-file notas.md --target "$GITHUB_SHA"
          fi
