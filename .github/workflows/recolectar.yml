name: Recolectar becas

on:
  schedule:
    - cron: '17 11 * * *'   # todos los días, 6:17 a. m. hora de Lima
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  push:                      # corre solo al subir cambios del recolector (incluida la primera subida)
    branches: [main]
    paths: ['collector/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Instalar
        working-directory: collector
        run: npm ci

      - name: Pruebas
        working-directory: collector
        run: npm test

      - name: Recolectar
        working-directory: collector
        run: npm start

      - name: Guardar resultados
        run: |
          git config user.name "becas-al-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/becas.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar becas $(date -u +%F)"
            git push
          fi
